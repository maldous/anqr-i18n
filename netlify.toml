[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# API redirect - must come BEFORE the SPA catch-all
[[redirects]]
  from = "/api/qr"
  to = "/.netlify/functions/qr"
  status = 200

# Legacy endpoint - redirect to new path for backward compatibility
[[redirects]]
  from = "/api/qr.png"
  to = "/api/qr"
  status = 301

# SPA catch-all for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
