apply plugin: 'com.android.application'

android {
    namespace = "link.anqr.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "link.anqr.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 38
        versionName "1.38"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Enable vector drawable support for smaller APK
        vectorDrawables.useSupportLibrary = true
        
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // Don't compress already-compressed web assets (they're minified JS/CSS)
            noCompress 'js', 'css', 'html', 'json', 'woff', 'woff2', 'ttf'
        }
        
        // Resource configuration - only include necessary densities and languages
        resConfigs "en", "ar", "bn", "es", "gu", "hi", "id", "ja", "kn", "ko", "ml", "mr", "ms", "pa", "pt", "ru", "ta", "te", "th", "tl", "vi", "zh"
    }
    signingConfigs {
        release {
            storeFile file('release-key.keystore')
            storePassword 'anqr2025'
            keyAlias 'anqr'
            keyPassword 'anqr2025'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Enable R8 code shrinking and obfuscation for smaller APK and Play Store compliance
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
    
    // Generate mapping file for Play Store crash deobfuscation
    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.all {
                outputFileName = "anqr-${variant.versionName}-${variant.buildType.name}.apk"
            }
        }
    }
    
    // ABI splits - DISABLED for AAB builds (AAB handles this automatically)
    // Enable only if building APKs directly instead of AAB
    splits {
        abi {
            enable false  // AAB handles ABI splitting automatically
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk false
        }
    }
    
    // Bundle configuration for AAB optimization (Play Store delivery)
    bundle {
        language {
            enableSplit = false  // Keep all languages (app handles i18n in JS)
        }
        density {
            enableSplit = true  // Split by screen density - reduces download size
        }
        abi {
            enableSplit = true  // Split by CPU architecture - major size savings
        }
    }
    
    // Packaging options - exclude unnecessary files
    packagingOptions {
        resources {
            excludes += [
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt', 
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/DEPENDENCIES',
                'META-INF/*.kotlin_module',
                'META-INF/versions/**',
                'kotlin/**',
                'DebugProbesKt.bin'
            ]
        }
        // Deduplicate native libraries from plugins
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }
    
    // Lint options for cleaner builds
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
