# Sync i18n translations to public repo
# When txt files in i18n directories change, push them to maldous/anqr-i18n
#
# SETUP REQUIRED:
# 1. Add your private SSH key as a GitHub secret named I18N_DEPLOY_KEY
#    - Go to: https://github.com/maldous/anqr/settings/secrets/actions
#    - Add secret: I18N_DEPLOY_KEY = contents of ~/.ssh/id_ed25519_public
#    - Run: cat ~/.ssh/id_ed25519_public | gh secret set I18N_DEPLOY_KEY
#
# 2. Ensure the public key is added to anqr-i18n with write access
#    - https://github.com/maldous/anqr-i18n/settings/keys

name: Sync i18n to Public Repo

on:
  push:
    branches:
      - master
    paths:
      - 'src/i18n/static/txt/**'
      - 'src/i18n/locales/txt/**'

jobs:
  sync-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for subtree

      - name: Setup SSH for public repo
        env:
          I18N_DEPLOY_KEY: ${{ secrets.I18N_DEPLOY_KEY }}
        run: |
          if [ -z "$I18N_DEPLOY_KEY" ]; then
            echo "Error: I18N_DEPLOY_KEY secret is not set"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$I18N_DEPLOY_KEY" > ~/.ssh/id_ed25519_public
          chmod 600 ~/.ssh/id_ed25519_public
          
          # Configure SSH to use this key for github-public host
          cat >> ~/.ssh/config << EOF
          Host github-public
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ed25519_public
            IdentitiesOnly yes
            StrictHostKeyChecking no
          EOF
          
          chmod 600 ~/.ssh/config

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Add public repo remote
        run: |
          git remote add anqr-i18n git@github-public:maldous/anqr-i18n.git || true

      - name: Push i18n to public repo
        run: |
          # Use subtree split + force push to handle diverged branch histories
          # This is necessary because the public repo branches may have commits
          # (like merge commits or manual fixes) that don't exist in the subtree history
          #
          # NOTE: Branch protection on static/locales branches must allow force pushes
          # from the deploy key, or be disabled. Configure at:
          # https://github.com/maldous/anqr-i18n/settings/branches
          
          echo "Pushing static/txt to public repo..."
          STATIC_SHA=$(git subtree split --prefix=src/i18n/static/txt)
          if [ -n "$STATIC_SHA" ]; then
            # Try normal push first, fall back to force push if rejected
            if git push anqr-i18n "$STATIC_SHA":static 2>/dev/null; then
              echo "Static branch updated successfully"
            elif git push anqr-i18n "$STATIC_SHA":static --force; then
              echo "Static branch force-updated successfully"
            else
              echo "Warning: Static push failed - check branch protection settings"
            fi
          else
            echo "No static content to push"
          fi
          
          echo "Pushing locales/txt to public repo..."
          LOCALES_SHA=$(git subtree split --prefix=src/i18n/locales/txt)
          if [ -n "$LOCALES_SHA" ]; then
            # Try normal push first, fall back to force push if rejected
            if git push anqr-i18n "$LOCALES_SHA":locales 2>/dev/null; then
              echo "Locales branch updated successfully"
            elif git push anqr-i18n "$LOCALES_SHA":locales --force; then
              echo "Locales branch force-updated successfully"
            else
              echo "Warning: Locales push failed - check branch protection settings"
            fi
          else
            echo "No locales content to push"
          fi
          
          echo "i18n sync complete!"
