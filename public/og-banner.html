<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1028,height=128,initial-scale=1" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1028px;
    height: 128px;
    overflow: hidden;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .title {
    font-size: 88px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -2px;
    text-shadow: 0 2px 30px rgba(59, 130, 246, 0.5);
    line-height: 128px;
    height: 128px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
  <div class="title">ANQR</div>
</body>
</html>
