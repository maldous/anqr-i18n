<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .container {
      text-align: center;
    }
    .title {
      font-size: 280px;
      font-weight: 800;
      color: white;
      letter-spacing: -8px;
      text-shadow: 0 4px 60px rgba(59, 130, 246, 0.5);
    }
    .subtitle {
      font-size: 36px;
      color: #94a3b8;
      margin-top: -20px;
      letter-spacing: 8px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">ANQR</div>
  </div>
</body>
</html>
