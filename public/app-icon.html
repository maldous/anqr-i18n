<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1024,height=1024,initial-scale=1" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1024px;
    height: 1024px;
    overflow: hidden;
    /* Radial gradient centered - fills entire square uniformly for circular cropping */
    background: radial-gradient(circle at center, #1e293b 0%, #0f172a 70%, #0a0f1a 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .title {
    font-size: 220px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -6px;
    text-shadow: 0 4px 60px rgba(59, 130, 246, 0.5);
  }
</style>
</head>
<body>
  <div class="title">ANQR</div>
</body>
</html>
